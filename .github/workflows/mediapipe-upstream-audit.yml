name: MediaPipe unmodified upstream audit build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mediapipe-upstream-audit.yml'
      - 'tools/build-mediapipe-upstream.sh'
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install upstream build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk clang-16 libegl1-mesa-dev libgles2-mesa-dev python3-dev python3-numpy
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} | "$manager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.1.13356709'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location https://github.com/bazelbuild/bazel/releases/download/7.4.1/bazel-7.4.1-linux-x86_64 -o "$RUNNER_TEMP/bazel"
          curl --fail --location https://github.com/bazelbuild/bazel/releases/download/7.4.1/bazel-7.4.1-linux-x86_64.sha256 -o "$RUNNER_TEMP/bazel.sha256"
          (cd "$RUNNER_TEMP" && sed 's/bazel-7.4.1-linux-x86_64/bazel/' bazel.sha256 | sha256sum --check)
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build official Tasks sources without internal usage logging
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          CC: clang-16
          CXX: clang++-16
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.1.13356709"
          bash tools/build-mediapipe-upstream.sh "$RUNNER_TEMP/mediapipe" "$RUNNER_TEMP/mediapipe-audit"
      - name: Retain audit evidence (not a shipping dependency)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mediapipe-upstream-audit
          path: ${{ runner.temp }}/mediapipe-audit
          retention-days: 7
