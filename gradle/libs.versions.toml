[versions]
agp = "9.4.1"
kotlin = "2.2.10"
camera = "1.6.2"
compose = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"
mediapipe = "0.10.32"

[libraries]
mediapipe-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }
mediapipe-core-upstream = { module = "com.aiphotographer.thirdparty:mediapipe-tasks-core", version = "0.10.32-upstream" }
guava-android = { module = "com.google.guava:guava", version = "27.0.1-android" }
flogger = { module = "com.google.flogger:flogger", version = "0.6" }
flogger-system-backend = { module = "com.google.flogger:flogger-system-backend", version = "0.6" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version = "4.28.3" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version = "4.13.2" }
android-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
android-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
